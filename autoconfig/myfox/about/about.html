<!DOCTYPE html>
<!-- about:myfox (see ../15-about-page.js). Its texts are filled in by
     about.js from the modules' string catalogs (../i18n/). Its files by
     their resource:// addresses: relative ones resolve against about:myfox. -->
<html id="myfox-root">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>MyFox tweaks</title>
  <link rel="icon" href="resource://myfox/about/favicon.svg">
  <link rel="stylesheet" href="chrome://global/skin/global.css">
  <link rel="stylesheet" href="chrome://global/skin/in-content/common.css">
  <link rel="stylesheet" href="resource://myfox/about/about.css">
  <script src="resource://myfox/about/about.js"></script>
  <script type="module" src="chrome://global/content/elements/moz-toggle.mjs"></script>
</head>
<body>
  <nav id="nav">
    <h1 id="nav-title">MyFox tweaks</h1>
    <a class="nav-item" href="#about" data-section="about" data-l10n="aboutpage.nav.about"></a>
    <a class="nav-item" href="#changelog" data-section="changelog" data-l10n="aboutpage.nav.changelog"></a>
    <a class="nav-item" href="#updates" data-section="updates" data-l10n="aboutpage.nav.updates"></a>
    <a class="nav-item" href="#settings" data-section="settings" data-l10n="aboutpage.nav.settings"></a>
    <a class="nav-item" href="#profiles" data-section="profiles" data-l10n="aboutpage.nav.profiles" hidden></a>
  </nav>
  <main>
    <section id="about" hidden>
      <h2 data-l10n="aboutpage.nav.about"></h2>
      <div class="box intro">
        <img class="cat" src="resource://myfox/about/cat.svg" alt="">
        <div>
          <p data-l10n="aboutpage.about.text"></p>
          <p id="about-version"></p>
        </div>
      </div>
      <h3 data-l10n="aboutpage.links.heading"></h3>
      <div class="box links">
        <a href="https://github.com/CustomFF/myfox-tweaks" data-l10n="aboutpage.links.tweaks"></a>
        <a href="https://github.com/CustomFF/myfox" data-l10n="aboutpage.links.myfox"></a>
        <a href="https://github.com/CustomFF/ddblm" data-l10n="aboutpage.links.bookmarklets"></a>
        <a href="https://github.com/CustomFF/userscripts" data-l10n="aboutpage.links.userscripts"></a>
      </div>
    </section>
    <section id="changelog" hidden>
      <h2 data-l10n="aboutpage.nav.changelog"></h2>
      <div id="changelog-list"></div>
    </section>
    <section id="updates" hidden>
      <h2 data-l10n="aboutpage.nav.updates"></h2>
      <div class="box" id="updates-box" hidden>
        <div id="updates-versions"></div>
        <div id="updates-status" class="setting-status" hidden></div>
        <div class="profiles-buttons">
          <button id="updates-install" class="primary" data-l10n="aboutpage.updates.install" hidden></button>
          <button id="updates-check" data-l10n="aboutpage.updates.check"></button>
        </div>
      </div>
      <div id="updates-changes"></div>
    </section>
    <section id="settings" hidden>
      <h2 data-l10n="aboutpage.nav.settings"></h2>
      <div class="box" id="appearance-box" hidden>
        <div class="setting-label" data-l10n="aboutpage.appearance.label"></div>
        <div class="setting-desc" data-l10n="aboutpage.appearance.desc"></div>
        <div class="theme-cards" role="radiogroup"></div>
      </div>
      <div class="box" id="command-box" hidden>
        <div class="setting">
          <div>
            <div class="setting-label" data-l10n="aboutpage.command.label"></div>
            <div class="setting-desc" id="command-desc"></div>
          </div>
          <moz-toggle id="command-toggle" disabled></moz-toggle>
        </div>
        <div id="command-status" class="setting-status" hidden></div>
      </div>
    </section>
    <section id="profiles" hidden>
      <h2 data-l10n="aboutpage.nav.profiles"></h2>
      <div class="box" id="profiles-box" hidden>
        <div id="profiles-list"></div>
        <div id="profiles-status" class="setting-status" hidden></div>
        <div class="profiles-buttons">
          <button id="profiles-new" data-l10n="aboutpage.profiles.new"></button>
          <button id="profiles-import" data-l10n="aboutpage.profiles.importFrom"></button>
        </div>
        <div id="profiles-foreign" hidden>
          <div class="setting-desc" id="profiles-foreign-desc" data-l10n="aboutpage.profiles.foreignDesc"></div>
          <div class="profiles-foreign-list"></div>
        </div>
      </div>
      <div class="box" id="profiles-command" hidden>
        <div class="setting-desc" data-l10n="aboutpage.profiles.commandDesc"></div>
        <div class="command-line"><code></code><button data-l10n="aboutpage.profiles.copy"></button></div>
      </div>
    </section>
  </main>
</body>
</html>
